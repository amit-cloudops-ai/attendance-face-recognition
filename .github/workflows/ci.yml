name: CI
on:
  pull_request:
    branches: [solo/amit-monday, develop, main]
  push:
    branches: [solo/amit-monday, develop, main, "ai/**"]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Check browser JavaScript syntax and HTML CSP hygiene
        run: |
          for file in web/*.js web/shared/*.js web/admin/*.js; do
            [ -f "$file" ] || continue
            node --input-type=module --check < "$file"
          done
          if grep -R --include='*.html' -n 'style="' web; then
            echo "Inline styles conflict with the strict Content-Security-Policy."
            exit 1
          fi
      - name: Check shell script syntax
        run: bash -n scripts/e2e_smoke.sh
      - name: Validate GitHub Actions workflow YAML
        run: |
          python - <<'PY'
          import yaml

          for path in (".github/workflows/ci.yml", ".github/workflows/deploy.yml"):
              with open(path, encoding="utf-8") as stream:
                  yaml.compose(stream, Loader=yaml.BaseLoader)
          PY

      - name: Validate rendered IAM permissions-boundary templates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for env in ("dev", "prod"):
              path = Path(f"infra/policies/execution-role-boundary-{env}.json.tftpl")
              rendered = path.read_text(encoding="utf-8").replace("${account_id}", "123456789012")
              if "${account_id}" in rendered:
                  raise SystemExit(f"Unresolved account placeholder in {path}")
              policy = json.loads(rendered)
              if policy.get("Version") != "2012-10-17" or not policy.get("Statement"):
                  raise SystemExit(f"Invalid IAM policy envelope in {path}")
              expected_alias = f"alias/attendance-{env}"
              statements = policy["Statement"]
              for statement in statements:
                  actions = statement.get("Action", [])
                  actions = [actions] if isinstance(actions, str) else actions
                  if any(action.startswith(("iam:", "sts:")) for action in actions):
                      raise SystemExit(f"Boundary must not manage IAM/STS: {path}")
                  if statement.get("Resource") == "*" and actions != ["rekognition:DetectFaces"]:
                      raise SystemExit(f"Unexpected unscoped resource in {path}: {actions}")
              kms = next(s for s in statements if s["Sid"] == "KmsRuntimeAccessViaS3AndSqs")
              if kms["Condition"]["ForAnyValue:StringEquals"]["kms:ResourceAliases"] != expected_alias:
                  raise SystemExit(f"Wrong KMS alias scope in {path}")
              if set(kms["Condition"]["StringEquals"]["kms:ViaService"]) != {
                  "s3.us-east-1.amazonaws.com", "sqs.us-east-1.amazonaws.com"
              }:
                  raise SystemExit(f"Wrong KMS ViaService scope in {path}")
              compact = json.dumps(policy, separators=(",", ":"))
              if len(compact) > 6144:
                  raise SystemExit(f"IAM managed policy size exceeds 6144 characters: {path}")
          PY

      - name: Validate environment deployment IAM policy templates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("infra/policies")
          names = (
              "github-plan-dev-core.json.tftpl",
              "github-plan-dev-edge.json.tftpl",
              "github-plan-dev-state.json.tftpl",
          )
          policies = {}
          for name in names:
              path = root / name
              rendered = path.read_text(encoding="utf-8")
              rendered = rendered.replace("${account_id}", "123456789012")
              rendered = rendered.replace("${state_bucket}", "attendance-tf-state-123456789012")
              if "${account_id}" in rendered or "${state_bucket}" in rendered:
                  raise SystemExit(f"Unresolved template variable in {path}")
              policy = json.loads(rendered)
              if policy.get("Version") != "2012-10-17" or not policy.get("Statement"):
                  raise SystemExit(f"Invalid policy envelope: {path}")
              if len(json.dumps(policy, separators=(",", ":"))) > 6144:
                  raise SystemExit(f"IAM managed policy size exceeded: {path}")
              policies[name] = policy

          if any(statement["Sid"] in ("BudgetRead", "BillingRead") for statement in policies[names[0]]["Statement"]):
              raise SystemExit("Environment plan role must not receive account-level billing permissions")
          core_edge = policies[names[0]]["Statement"] + policies[names[1]]["Statement"]
          scheduler_read = next(
              statement for statement in policies[names[0]]["Statement"]
              if statement["Sid"] == "SchedulerRead"
          )
          scheduler_group_read = next(
              statement for statement in policies[names[0]]["Statement"]
              if statement["Sid"] == "SchedulerGroupRead"
          )
          if scheduler_read["Resource"] != (
              "arn:aws:scheduler:us-east-1:123456789012:schedule/attendance-dev/attendance-dev-*"
          ):
              raise SystemExit("Dev plan schedule read must use the dedicated dev schedule group")
          if scheduler_group_read["Resource"] != (
              "arn:aws:scheduler:us-east-1:123456789012:schedule-group/attendance-dev"
          ):
              raise SystemExit("Dev plan schedule-group read must be environment-scoped")
          forbidden_prefixes = (
              "iam:Create", "iam:Put", "iam:Update", "iam:Delete", "iam:PassRole",
              "iam:Attach", "iam:Detach", "iam:Tag", "iam:Untag", "sts:Assume",
              "lambda:Create", "lambda:Update", "lambda:Delete", "lambda:AddPermission",
              "lambda:RemovePermission", "lambda:Put", "lambda:Invoke",
              "s3:Put", "s3:Delete", "kms:Create", "kms:Put", "kms:Schedule",
              "kms:Enable", "kms:Disable", "cloudfront:Create", "cloudfront:Update",
              "cloudfront:Delete", "cloudfront:TagResource", "cloudfront:UntagResource",
              "cognito-idp:Create", "cognito-idp:Update", "cognito-idp:Delete",
              "cognito-idp:TagResource", "cognito-idp:UntagResource",
              "apigateway:POST", "apigateway:PUT", "apigateway:PATCH", "apigateway:DELETE",
              "sns:Publish", "dynamodb:Create", "dynamodb:Update", "dynamodb:Delete",
              "dynamodb:Put", "sqs:Create", "sqs:Set", "sqs:Delete", "sqs:Send",
              "scheduler:Create", "scheduler:Update", "scheduler:Delete", "scheduler:TagResource", "scheduler:UntagResource",
              "rekognition:Create", "rekognition:Index", "rekognition:Delete",
              "cloudwatch:Put", "cloudwatch:Delete", "logs:Create", "logs:Put",
              "logs:Delete", "budgets:Modify"
          )
          for statement in core_edge:
              actions = statement.get("Action", [])
              actions = [actions] if isinstance(actions, str) else actions
              if any(action.startswith(forbidden_prefixes) for action in actions):
                  raise SystemExit(f"Mutation action in read-only plan policy: {statement['Sid']}")
              resources = statement.get("Resource", [])
              resources = [resources] if isinstance(resources, str) else resources
              if any("attendance/prod/" in resource or "attendance-prod-" in resource for resource in resources):
                  raise SystemExit(f"Production resource in dev plan policy: {statement['Sid']}")

          state_statements = policies[names[2]]["Statement"]
          for statement in state_statements:
              actions = statement.get("Action", [])
              actions = [actions] if isinstance(actions, str) else actions
              resources = statement.get("Resource", [])
              resources = [resources] if isinstance(resources, str) else resources
              if any(action in ("s3:PutObject", "s3:DeleteObject") for action in actions):
                  if not all(resource.endswith(".tflock") for resource in resources):
                      raise SystemExit("Dev plan may mutate only its Terraform lockfile")
              if any("attendance/prod/" in resource for resource in resources):
                  raise SystemExit("Dev state policy references production state")
          PY

      - name: Validate environment-specific Scheduler trust
        run: |
          python - <<'PY'
          from pathlib import Path

          module = Path("infra/modules/data/main.tf").read_text(encoding="utf-8")
          variables = Path("infra/modules/data/variables.tf").read_text(encoding="utf-8")
          if 'resource "aws_scheduler_schedule_group" "attendance"' not in module:
              raise SystemExit("Missing dedicated attendance Scheduler group")
          if 'name = "attendance-${var.env}"' not in module:
              raise SystemExit("Scheduler group name must be environment-specific")
          if 'variable = "aws:SourceAccount"' not in module or "values   = [var.account_id]" not in module:
              raise SystemExit("Scheduler trust must require the owning AWS account")
          if 'variable = "aws:SourceArn"' not in module or "aws_scheduler_schedule_group.attendance.arn" not in module:
              raise SystemExit("Scheduler trust must use the exact environment schedule-group ARN")
          if "group_name                   = aws_scheduler_schedule_group.attendance.name" not in module:
              raise SystemExit("Schedules must be assigned to the dedicated environment group")
          if 'variable "account_id"' not in variables:
              raise SystemExit("Data module must receive the verified account ID")
          for env in ("dev", "prod"):
              root = Path(f"infra/envs/{env}/main.tf").read_text(encoding="utf-8")
              start = root.index('module "data"')
              end = root.find('\n}', start)
              if "account_id                  = var.account_id" not in root[start:end]:
                  raise SystemExit(f"{env} data module must receive account_id")
          PY

      - name: Validate exact CloudFront KMS key policy scope
        run: |
          python - <<'PY'
          from pathlib import Path

          access = Path("infra/modules/access/main.tf").read_text(encoding="utf-8")
          foundation = Path("infra/modules/foundation/main.tf").read_text(encoding="utf-8")
          outputs = Path("infra/modules/foundation/outputs.tf").read_text(encoding="utf-8")
          access_vars = Path("infra/modules/access/variables.tf").read_text(encoding="utf-8")
          if 'resource "aws_kms_key_policy" "attendance"' not in access:
              raise SystemExit("Access module must own final KMS key policy")
          if "aws_cloudfront_distribution.site.arn" not in access:
              raise SystemExit("CloudFront KMS policy must use exact distribution ARN")
          if 'variable = "aws:SourceArn"' not in access or 'test     = "ArnEquals"' not in access:
              raise SystemExit("CloudFront KMS grant must use ArnEquals SourceArn")
          if "distribution/*" in access or "distribution/*" in foundation:
              raise SystemExit("CloudFront distribution wildcard remains in KMS policy")
          if 'policy                  = data.aws_iam_policy_document.kms_key.json' in foundation:
              raise SystemExit("Foundation must not install a pre-distribution KMS policy")
          if 'output "kms_key_id"' not in outputs or 'variable "kms_key_id"' not in access_vars:
              raise SystemExit("Foundation key ID must be passed into access module")
          for env in ("dev", "prod"):
              root = Path(f"infra/envs/{env}/main.tf").read_text(encoding="utf-8")
              start = root.index('module "access"')
              end = root.find('\n}', start)
              if "kms_key_id" not in root[start:end]:
                  raise SystemExit(f"{env} access module must receive foundation KMS key ID")
          access_outputs = Path("infra/modules/access/outputs.tf").read_text(encoding="utf-8")
          if "cognito-idp.us-east-1.amazonaws.com" not in access_outputs:
              raise SystemExit("Cognito issuer output must match us-east-1")
          PY

      - name: Validate DynamoDB customer-managed KMS policies
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          access = Path("infra/modules/access/main.tf").read_text(encoding="utf-8")
          required_service_actions = {
              "kms:Encrypt", "kms:Decrypt", "kms:ReEncryptFrom", "kms:ReEncryptTo",
              "kms:GenerateDataKey", "kms:GenerateDataKeyWithoutPlaintext", "kms:CreateGrant",
              "kms:DescribeKey",
          }
          if "AllowDynamoDBUseOfKeyThroughService" not in access:
              raise SystemExit("Missing DynamoDB KMS ViaService statement")
          if "dynamodb.us-east-1.amazonaws.com" not in access or "kms:CallerAccount" not in access:
              raise SystemExit("DynamoDB KMS service statement must be account and region constrained")
          if "AllowDynamoDBDirectKeyMetadata" not in access or "dynamodb.amazonaws.com" not in access:
              raise SystemExit("Missing DynamoDB direct key-metadata service principal statement")

          for env in ("dev", "prod"):
              path = Path(f"infra/policies/github-apply-{env}-dynamodb-kms.json.tftpl")
              rendered = path.read_text(encoding="utf-8").replace("${account_id}", "123456789012")
              if "${account_id}" in rendered:
                  raise SystemExit(f"Unresolved account placeholder in {path}")
              policy = json.loads(rendered)
              if len(json.dumps(policy, separators=(",", ":"))) > 6144:
                  raise SystemExit(f"IAM managed policy size exceeded: {path}")
              crypto = next(s for s in policy["Statement"] if s["Sid"] == "DynamoDBCustomerKeyCrypto")
              grant = next(s for s in policy["Statement"] if s["Sid"] == "DynamoDBCustomerKeyGrant")
              actions = set(crypto["Action"])
              if actions != required_service_actions - {"kms:CreateGrant"}:
                  raise SystemExit(f"Unexpected DynamoDB crypto action set: {path}")
              if crypto["Condition"]["StringEquals"]["kms:ViaService"] != "dynamodb.us-east-1.amazonaws.com":
                  raise SystemExit(f"Wrong DynamoDB ViaService condition: {path}")
              if crypto["Condition"]["ForAnyValue:StringEquals"]["kms:ResourceAliases"] != f"alias/attendance-{env}":
                  raise SystemExit(f"Wrong environment KMS alias scope: {path}")
              if grant["Action"] != "kms:CreateGrant" or grant["Condition"]["Bool"]["kms:GrantIsForAWSResource"] != "true":
                  raise SystemExit(f"CreateGrant must be AWS-resource constrained: {path}")
              if grant["Condition"]["StringEquals"]["kms:ViaService"] != "dynamodb.us-east-1.amazonaws.com":
                  raise SystemExit(f"CreateGrant must be ViaService constrained: {path}")
          PY

      - name: Validate dev apply-role IAM policy templates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("infra/policies")
          names = (
              "github-apply-dev-core.json.tftpl",
              "github-apply-dev-data.json.tftpl",
              "github-apply-dev-lambda.json.tftpl",
              "github-apply-dev-iam.json.tftpl",
              "github-apply-dev-foundation.json.tftpl",
              "github-apply-dev-access.json.tftpl",
              "github-apply-dev-state.json.tftpl",
              "github-apply-dev-dynamodb-kms.json.tftpl",
          )
          policies = {}
          for name in names:
              path = root / name
              rendered = path.read_text(encoding="utf-8").replace("${account_id}", "123456789012")
              rendered = rendered.replace("${state_bucket}", "attendance-tf-state-123456789012")
              if "${account_id}" in rendered or "${state_bucket}" in rendered:
                  raise SystemExit(f"Unresolved template variable: {path}")
              policy = json.loads(rendered)
              if policy.get("Version") != "2012-10-17" or not policy.get("Statement"):
                  raise SystemExit(f"Invalid policy envelope: {path}")
              if len(json.dumps(policy, separators=(",", ":"))) > 6144:
                  raise SystemExit(f"IAM managed policy exceeds 6,144 characters: {path}")
              for statement in policy["Statement"]:
                  actions = statement.get("Action", [])
                  actions = [actions] if isinstance(actions, str) else actions
                  resources = statement.get("Resource", [])
                  resources = [resources] if isinstance(resources, str) else resources
                  if any(action.startswith(("budgets:", "aws-portal:")) for action in actions):
                      raise SystemExit(f"Billing permissions must stay in separate billing root: {path}")
                  if any("attendance/prod/" in resource or "attendance-prod-" in resource for resource in resources):
                      raise SystemExit(f"Production resource in dev apply policy: {path}")
              policies[name] = policy

          iam = policies["github-apply-dev-iam.json.tftpl"]["Statement"]
          for sid in ("PassRoleToLambda", "PassRoleToScheduler"):
              statement = next(s for s in iam if s["Sid"] == sid)
              if any("*" in resource for resource in statement["Resource"]):
                  raise SystemExit(f"{sid} must use exact role ARNs")
              if "iam:PassRole" not in statement["Action"]:
                  raise SystemExit(f"{sid} missing iam:PassRole")
              if "iam:PassedToService" not in statement.get("Condition", {}).get("StringEquals", {}):
                  raise SystemExit(f"{sid} must constrain PassedToService")
          create_role = next(s for s in iam if s["Sid"] == "IamRoleCreate")
          if create_role.get("Condition", {}).get("StringEquals", {}).get("iam:PermissionsBoundary") != (
              "arn:aws:iam::123456789012:policy/attendance-dev-execution-boundary"
          ):
              raise SystemExit("CreateRole must require the exact dev permissions boundary")

          state = policies["github-apply-dev-state.json.tftpl"]["Statement"]
          state_object = next(s for s in state if s["Sid"] == "DevStateObject")
          if set(state_object["Action"]) != {"s3:GetObject", "s3:PutObject"}:
              raise SystemExit("Dev apply state object permissions must be read/write only")
          if state_object["Resource"] != "arn:aws:s3:::attendance-tf-state-123456789012/attendance/dev/terraform.tfstate":
              raise SystemExit("Dev apply state object must be exact")
          lock = next(s for s in state if s["Sid"] == "DevLockfileLifecycle")
          lock_resources = lock["Resource"]
          lock_resources = [lock_resources] if isinstance(lock_resources, str) else lock_resources
          if not all(resource.endswith(".tflock") for resource in lock_resources):
              raise SystemExit("State lock mutations must be limited to the dev .tflock object")

          data = policies["github-apply-dev-data.json.tftpl"]["Statement"]
          tables = next(s for s in data if s["Sid"] == "DynamoDBTableLifecycle")
          if len(tables["Resource"]) != 5 or any("attendance-prod-" in r for r in tables["Resource"]):
              raise SystemExit("DynamoDB apply policy must use the five dev table ARNs only")

          lambda_policy = policies["github-apply-dev-lambda.json.tftpl"]["Statement"]
          mapping = next(s for s in lambda_policy if s["Sid"] == "LambdaEventSourceMappingCreate")
          if mapping["Resource"] != "*" or mapping["Condition"]["StringEquals"]["lambda:FunctionArn"] != (
              "arn:aws:lambda:us-east-1:123456789012:function:attendance-dev-failure"
          ):
              raise SystemExit("Event source mapping create must be function-conditioned")

          access = policies["github-apply-dev-access.json.tftpl"]["Statement"]
          api = next(s for s in access if s["Sid"] == "ApiGatewayManageApi")
          if api["Resource"] != "arn:aws:apigateway:us-east-1::/apis/*":
              raise SystemExit("API Gateway permissions must be restricted to API resource paths")
          PY

  terraform-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/checkout@v4
      - run: terraform fmt -check -diff -recursive infra
      - name: Verify committed environment and billing provider lockfiles
        run: |
          terraform -chdir=infra/envs/dev init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/envs/prod init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/billing init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/modules/recognition init -backend=false -input=false
      - run: terraform -chdir=infra/modules/recognition validate
      - run: terraform -chdir=infra/modules/data init -backend=false -input=false
      - run: terraform -chdir=infra/modules/data validate
      - run: terraform -chdir=infra/modules/foundation init -backend=false -input=false
      - run: terraform -chdir=infra/modules/foundation validate
      - run: terraform -chdir=infra/modules/access init -backend=false -input=false
      - run: terraform -chdir=infra/modules/access validate
      - run: terraform -chdir=infra/envs/dev init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/envs/dev validate
      - run: terraform -chdir=infra/envs/prod init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/envs/prod validate
      - run: terraform -chdir=infra/billing init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/billing validate
