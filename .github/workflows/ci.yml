          )
          policies = {}
          for name in names:
              path = root / name
              rendered = path.read_text(encoding="utf-8").replace("${account_id}", "123456789012")
              rendered = rendered.replace("${state_bucket}", "attendance-tf-state-123456789012-ci-test")
              if "${account_id}" in rendered or "${state_bucket}" in rendered:
                  raise SystemExit(f"Unresolved template variable: {path}")
              policy = json.loads(rendered)
              if policy.get("Version") != "2012-10-17" or not policy.get("Statement"):
                  raise SystemExit(f"Invalid policy envelope: {path}")
              if len(json.dumps(policy, separators=(",", ":"))) > 6144:
                  raise SystemExit(f"IAM managed policy exceeds 6,144 characters: {path}")
              for statement in policy["Statement"]:
                  actions = statement.get("Action", [])
                  actions = [actions] if isinstance(actions, str) else actions
                  resources = statement.get("Resource", [])
                  resources = [resources] if isinstance(resources, str) else resources
                  if any(action.startswith(("budgets:", "aws-portal:")) for action in actions):
                      raise SystemExit(f"Billing permissions must stay in separate billing root: {path}")
                  if any("attendance/dev/" in resource or "attendance-dev-" in resource for resource in resources):
                      raise SystemExit(f"Dev resource in prod apply policy: {path}")
              policies[name] = policy

          iam = policies["github-apply-prod-iam.json.tftpl"]["Statement"]
          for sid, service in (("PassRoleToLambda", "lambda.amazonaws.com"), ("PassRoleToScheduler", "scheduler.amazonaws.com")):
              statement = next(s for s in iam if s["Sid"] == sid)
              if any("*" in resource for resource in statement["Resource"]):
                  raise SystemExit(f"{sid} must use exact role ARNs")
              if statement.get("Condition", {}).get("StringEquals", {}).get("iam:PassedToService") != service:
                  raise SystemExit(f"{sid} must constrain PassedToService to {service}")
          create_role = next(s for s in iam if s["Sid"] == "IamRoleCreate")
          if create_role.get("Condition", {}).get("StringEquals", {}).get("iam:PermissionsBoundary") != (
              "arn:aws:iam::123456789012:policy/attendance-prod-execution-boundary"
          ):
              raise SystemExit("CreateRole must require the exact prod permissions boundary")

          state = policies["github-apply-prod-state.json.tftpl"]["Statement"]
          state_object = next(s for s in state if s["Sid"] == "ProdStateObject")
          if set(state_object["Action"]) != {"s3:GetObject", "s3:PutObject"}:
              raise SystemExit("Prod apply state object permissions must be read/write only")
          if state_object["Resource"] != "arn:aws:s3:::attendance-tf-state-123456789012-ci-test/attendance/prod/terraform.tfstate":
              raise SystemExit("Prod apply state object must be exact")
          lock = next(s for s in state if s["Sid"] == "ProdLockfileLifecycle")
          lock_resources = lock["Resource"]
          lock_resources = [lock_resources] if isinstance(lock_resources, str) else lock_resources
          if not all(resource.endswith(".tflock") for resource in lock_resources):
              raise SystemExit("Prod state lock mutations must be limited to the prod .tflock object")

          data = policies["github-apply-prod-data.json.tftpl"]["Statement"]
          tables = next(s for s in data if s["Sid"] == "DynamoDBTableLifecycle")
          if len(tables["Resource"]) != 5 or any("attendance-dev-" in r for r in tables["Resource"]):
              raise SystemExit("DynamoDB apply policy must use the five prod table ARNs only")

          lambda_policy = policies["github-apply-prod-lambda.json.tftpl"]["Statement"]
          mapping = next(s for s in lambda_policy if s["Sid"] == "LambdaEventSourceMappingCreate")
          if mapping["Resource"] != "*" or mapping["Condition"]["StringEquals"]["lambda:FunctionArn"] != (
              "arn:aws:lambda:us-east-1:123456789012:function:attendance-prod-failure"
          ):
              raise SystemExit("Event source mapping create must be function-conditioned to prod failure processor")

          kms = policies["github-apply-prod-dynamodb-kms.json.tftpl"]["Statement"]
          crypto = next(s for s in kms if s["Sid"] == "DynamoDBCustomerKeyCrypto")
          grant = next(s for s in kms if s["Sid"] == "DynamoDBCustomerKeyGrant")
          if crypto["Condition"]["ForAnyValue:StringEquals"]["kms:ResourceAliases"] != "alias/attendance-prod":
              raise SystemExit("Prod DynamoDB KMS crypto policy must use prod alias")
          if crypto["Condition"]["StringEquals"]["kms:ViaService"] != "dynamodb.us-east-1.amazonaws.com":
              raise SystemExit("Prod DynamoDB KMS crypto policy must use DynamoDB ViaService")
          if grant["Condition"]["ForAnyValue:StringEquals"]["kms:ResourceAliases"] != "alias/attendance-prod":
              raise SystemExit("Prod CreateGrant policy must use prod alias")
          if grant["Condition"]["Bool"]["kms:GrantIsForAWSResource"] != "true":
              raise SystemExit("Prod CreateGrant must be AWS-resource constrained")
          PY

      - name: Validate S3 Terraform state backend configuration
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          expected = {
              "dev": ("attendance/dev/terraform.tfstate", "../../../config/deployment.json"),
              "prod": ("attendance/prod/terraform.tfstate", "../../../config/deployment.json"),
              "billing": ("attendance/billing/terraform.tfstate", "../../config/deployment.json"),
          }
          for env, (key, manifest_path) in expected.items():
              path = Path(f"infra/{'envs/' + env if env in ('dev', 'prod') else 'billing'}/versions.tf")
              source = path.read_text(encoding="utf-8")
              for required in ('backend "s3"', f'key          = "{key}"',
                               "encrypt      = true", "use_lockfile = true",
                               manifest_path):
                  if required not in source:
                      raise SystemExit(f"{path} missing backend/provider requirement: {required}")
              if not re.search(r"^\s*region\s*=\s*local\.deployment_region\s*$", source, re.MULTILINE):
                  raise SystemExit(f"{path} provider region must load from the canonical manifest")
              backend = source.split('backend "s3" {', 1)[1].split("}", 1)[0]
              if re.search(r"^\s*region\s*=", backend, re.MULTILINE):
                  raise SystemExit(f"{path} duplicates backend region outside canonical manifest")
          spec = Path("docs/STATE-BUCKET-BOOTSTRAP.md").read_text(encoding="utf-8")
          for required in ("SSE-S3", "BucketOwnerEnforced", "BlockPublicAcls",
                           "IgnorePublicAcls", "BlockPublicPolicy", "RestrictPublicBuckets",
                           "aws:SecureTransport", "attendance/dev/terraform.tfstate",
                           "attendance/prod/terraform.tfstate", "attendance/billing/terraform.tfstate",
                           "No object lock", "No automatic state expiration"):
              if required not in spec:
                  raise SystemExit(f"State bucket bootstrap spec missing: {required}")
          PY

      - name: Validate GitHub OIDC trust and deployment workflow boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          repo = "amit-cloudops-ai/attendance-face-recognition"
          provider = "arn:aws:iam::123456789012:oidc-provider/token.actions.githubusercontent.com"
          for env in ("dev", "prod", "billing"):
              for operation in ("plan", "apply"):
                  path = Path(f"infra/policies/github-oidc-trust-{env}-{operation}.json.tftpl")
                  rendered = path.read_text(encoding="utf-8").replace("${account_id}", "123456789012")
                  if "${account_id}" in rendered:
                      raise SystemExit(f"Unresolved account placeholder: {path}")
                  policy = json.loads(rendered)
                  if len(policy.get("Statement", [])) != 1:
                      raise SystemExit(f"Expected one trust statement: {path}")
                  statement = policy["Statement"][0]
                  if statement.get("Principal", {}).get("Federated") != provider:
                      raise SystemExit(f"Wrong OIDC provider principal: {path}")
                  if statement.get("Action") != "sts:AssumeRoleWithWebIdentity":
                      raise SystemExit(f"Wrong OIDC action: {path}")
                  conditions = statement.get("Condition", {}).get("StringEquals", {})
                  if conditions.get("token.actions.githubusercontent.com:aud") != "sts.amazonaws.com":
                      raise SystemExit(f"Wrong OIDC audience: {path}")
                  expected_sub = f"repo:{repo}:environment:{env}-{operation}"
                  if conditions.get("token.actions.githubusercontent.com:sub") != expected_sub:
                      raise SystemExit(f"Wrong or broad OIDC subject: {path}")

          workflow = Path(".github/workflows/deploy.yml").read_text(encoding="utf-8")
          environment_expr = "$" + "{{ inputs.environment }}"
          operation_expr = "$" + "{{ inputs.operation }}"
          role_var_expr = "$" + "{{ vars.AWS_ROLE_ARN }}"
          role_env_expr = "$" + "{{ env.AWS_ROLE_ARN }}"
          for required in (
              "name: " + environment_expr + "-" + operation_expr,
              "AWS_ROLE_ARN: " + role_var_expr,
              "github.ref == 'refs/heads/develop'",
              "github.ref == 'refs/heads/main'",
              "actions: read",
              "contents: read",
              "id-token: write",
              "role-to-assume: " + role_env_expr,
          ):
              if required not in workflow:
                  raise SystemExit(f"Deployment workflow missing required OIDC boundary: {required}")
          if "AWS_ACCESS_KEY_ID" in workflow or "AWS_SECRET_ACCESS_KEY" in workflow:
              raise SystemExit("Static AWS credentials are not permitted in deployment workflow")

          docs = Path("docs/GITHUB-OIDC-DEPLOYMENT.md").read_text(encoding="utf-8")
          for required in ("dev-plan", "dev-apply", "prod-plan", "prod-apply", "billing-plan", "billing-apply",
                           "solo-owner", "self-review is allowed", "TF_PLAN_AGE_RECIPIENT",
                           "TF_PLAN_AGE_IDENTITY"):
              if required not in docs:
                  raise SystemExit(f"OIDC deployment guide missing: {required}")
          PY

