name: Manual Terraform deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - prod
      operation:
        description: Plan only, or apply the freshly generated plan
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

concurrency:
  group: attendance-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform:
    name: ${{ inputs.operation }} ${{ inputs.environment }}
    if: ${{ (inputs.environment == 'dev' && github.ref == 'refs/heads/develop') || (inputs.environment == 'prod' && github.ref == 'refs/heads/main') }}
    environment:
      name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_REGION: ap-south-1
      AWS_ROLE_ARN: ${{ inputs.environment == 'prod' && vars.AWS_ROLE_ARN_PROD || vars.AWS_ROLE_ARN_DEV }}
      TF_ROOT: infra/envs/${{ inputs.environment }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_callback_urls: ${{ vars.COGNITO_CALLBACK_URLS }}
      TF_VAR_logout_urls: ${{ vars.COGNITO_LOGOUT_URLS }}
      TF_VAR_allowed_origins: ${{ vars.ALLOWED_ORIGINS }}

    steps:
      - name: Check out selected release branch
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_ROLE_ARN TF_STATE_BUCKET TF_VAR_account_id TF_VAR_alert_email TF_VAR_callback_urls TF_VAR_logout_urls TF_VAR_allowed_origins; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub repository/environment variable for ${name}."
              exit 1
            fi
          done
          python - <<'PY'
          import json
          import os

          for name in ("TF_VAR_callback_urls", "TF_VAR_logout_urls", "TF_VAR_allowed_origins"):
              value = json.loads(os.environ[name])
              if not isinstance(value, list) or not value or not all(isinstance(item, str) and item for item in value):
                  raise SystemExit(f"{name} must be a non-empty JSON array of strings")
          PY

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Configure short-lived AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: attendance-${{ inputs.environment }}-${{ github.run_id }}

      - name: Initialize remote state
        run: |
          terraform -chdir="$TF_ROOT" init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate Terraform root
        run: terraform -chdir="$TF_ROOT" validate

      - name: Create deployment plan
        run: terraform -chdir="$TF_ROOT" plan -input=false -out=tfplan

      - name: Upload plan for review
        if: ${{ inputs.operation == 'plan' }}
        uses: actions/upload-artifact@v4
        with:
          name: attendance-${{ inputs.environment }}-terraform-plan
          path: infra/envs/${{ inputs.environment }}/tfplan
          retention-days: 1
          if-no-files-found: error

      - name: Apply the reviewed-in-run plan
        if: ${{ inputs.operation == 'apply' }}
        run: terraform -chdir="$TF_ROOT" apply -input=false -auto-approve tfplan

      - name: Print deployed site URL
        if: ${{ inputs.operation == 'apply' }}
        run: terraform -chdir="$TF_ROOT" output -raw site_url
